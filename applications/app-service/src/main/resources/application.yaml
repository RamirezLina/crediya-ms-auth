server:
  port: 8080
  error:
    include-message: always
spring:
  application:
    name: "ms-authentication"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: "${R2DBC_HOST}"
    port: "${R2DBC_PORT}"
    database: "${R2DBC_DATABASE}"
    schema: "${R2DBC_SCHEMA}"
    username: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"
    
routes:
  paths:
    users: "/api/v1/usuarios"
    
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    url: /openapi.yaml
    path: /doc/swagger-ui.html
  paths-to-match: /api/**
  
app:
  openapi:
    title: "CREDIYA: ms-authentication"
    description: "Api para la gestion de usuarios de la plataforma CrediYa"
    version: 1.0.0
    server: http://localhost:8080
